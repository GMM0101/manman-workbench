<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9ed1a8">
<title>漫漫的工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">🐚</span><span class="brand-name">漫漫 · 个人工作台</span></div>
  <div class="top-time" id="topTime">--</div>
  <div class="top-actions">
    <button class="icon-btn" title="安装到主屏幕" onclick="doInstall()">📲</button>
    <button class="icon-btn" title="设置" onclick="go('tools','settings')">⚙️</button>
  </div>
</header>

<div class="layout">
  <aside class="left" id="leftPanel">
    <div class="user-card">
      <div class="avatar">漫</div>
      <div class="uinfo">
        <div class="uname">漫漫</div>
        <div class="usub">个人专属 AI 工作台</div>
      </div>
    </div>
    <div class="user-stats" id="userStats"></div>
    <nav class="nav" id="navList"></nav>
    <div class="left-foot">数据仅存本地 · 设置里可备份</div>
  </aside>

  <main class="main" id="main">
    <div class="boot-hint" id="bootHint">⏳ 工作台加载中…</div>
  </main>

  <aside class="right" id="rightPanel">
    <div class="ai-head"><span>🤖</span> 小顾 AI 助手</div>
    <div class="ai-body" id="aiBody"></div>
    <div class="ai-quick" id="aiQuick"></div>
    <div class="ai-input">
      <input id="aiInput" placeholder="问问小顾…" onkeydown="if(event.key==='Enter')sendAI()">
      <button onclick="sendAI()">发送</button>
    </div>
  </aside>
</div>

<nav class="mobile-tab" id="mobileTab"></nav>
<button class="fab" onclick="toggleAI()" title="AI 助手">🤖</button>
<div class="ai-mask" id="aiMask" onclick="toggleAI()"></div>

<script>
window.addEventListener('error', function(e){
  var m = document.getElementById('main');
  if(m) m.innerHTML = '<div class="err-box">⚠️ 脚本错误：' + (e.message||'未知') +
    '<br><small>' + (e.filename||'') + ':' + (e.lineno||'') + '</small><br>' +
    '<small>请强制刷新（Ctrl+Shift+R / 手机划掉重进）后重试</small></div>';
});
</script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js?v=20260728').catch(function(){}); });
}
</script>
</body>
</html>
